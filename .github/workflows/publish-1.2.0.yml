name: Publish GT IPTV Player Pro 1.2.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.2.0.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gtiptvplayerpro-1.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'VicTuS59/GT-IPTV-Player-Pro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'Release 1.2.0 stable')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      IPK: dist/enigma2-plugin-extensions-gtiptvplayerpro_1.2.0-r0_all.ipk
      EXPECTED_SHA256: 14b6a7be49bf0fc061196928df1de5fd72b7b8b888ac0e5ac15248c9c1d332b8
      RELEASE_NOTES_BASE64: 
    steps:
      - name: Check out approved stable sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build and verify the approved package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root = Path('GTIPTVPlayerPro')
          metadata = (root / '__init__.py').read_text()
          assert 'PLUGIN_VERSION = "1.2.0"' in metadata
          assert '\nVersion: 1.2.0-r0\n' in Path('CONTROL/control').read_text()
          for path in root.rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path), feature_version=(3, 9))
          PY
          node --check GTIPTVPlayerPro/web/app.js
          sh -n CONTROL/postinst CONTROL/prerm CONTROL/postrm scripts/build-ipk.sh
          scripts/build-ipk.sh
          printf '%s  %s\n' "$EXPECTED_SHA256" "$IPK" | sha256sum --check --strict -
          (cd dist && sha256sum "$(basename "$IPK")" > "$(basename "$IPK").sha256")
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          body = base64.b64decode(os.environ['RELEASE_NOTES_BASE64'], validate=True)
          assert os.environ['EXPECTED_SHA256'].encode() in body
          Path(os.environ['RUNNER_TEMP'], 'release-notes.txt').write_bytes(body)
          PY

      - name: Add the verified IPK to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$IPK" "$IPK.sha256"
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified 1.2.0 release package'
          fi
          git push origin HEAD:main
          printf 'RELEASE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish v1.2.0 and both download assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.2.0 "$IPK" "$IPK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title 'GT IPTV Player Pro v1.2.0' \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            --latest
