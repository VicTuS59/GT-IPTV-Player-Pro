name: Publish signed IPTV update
on:
  workflow_dispatch:
  release:
    types: [published, edited]
permissions:
  contents: write
concurrency:
  group: gtiptv-signed-update-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'VicTuS59/GT-IPTV-Player-Pro' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline updater security and package tests
        run: |
          python3 -B tests/test-updater.py
          python3 -B tests/test-update-backup.py
      - name: Build, sign and publish stable update
        env:
          GH_TOKEN: ${{ github.token }}
          GTIPTV_UPDATE_SIGNING_KEY: ${{ secrets.GTIPTV_UPDATE_SIGNING_KEY }}
          SOURCE_DATE_EPOCH: '1700000000'
        run: python3 -B scripts/publish-update.py publish
  release-pointer:
    if: github.repository == 'VicTuS59/GT-IPTV-Player-Pro' && github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify published assets and refresh stable update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 -B scripts/publish-update.py refresh --tag "$RELEASE_TAG"
